<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%" fill="none">
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Variable Labels (Sticky Tags) -->
  <g filter="url(#shadow2)">
    <rect x="40" y="35" width="180" height="60" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="68" cy="65" r="14" fill="#6366f1"/>
    <text x="68" y="70" fill="#ffffff" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">a</text>
    <text x="95" y="62" fill="#0f172a" font-size="14" font-family="monospace" font-weight="bold">user_name</text>
    <text x="95" y="78" fill="#64748b" font-size="11" font-family="sans-serif">Variable Tag (Stack)</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="40" y="125" width="180" height="60" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="68" cy="155" r="14" fill="#8b5cf6"/>
    <text x="68" y="160" fill="#ffffff" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">b</text>
    <text x="95" y="152" fill="#0f172a" font-size="14" font-family="monospace" font-weight="bold">alias_name</text>
    <text x="95" y="168" fill="#64748b" font-size="11" font-family="sans-serif">Variable Tag (b = a)</text>
  </g>

  <!-- Pointers -->
  <path d="M225 65 C320 65, 330 100, 420 100" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="6 6"/>
  <polygon points="428,100 416,94 416,106" fill="#6366f1"/>

  <path d="M225 155 C320 155, 330 115, 420 110" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="6 6"/>
  <polygon points="428,110 416,104 416,116" fill="#8b5cf6"/>

  <!-- Python Heap Object -->
  <g filter="url(#shadow2)">
    <rect x="440" y="30" width="320" height="155" rx="22" fill="#fdf4ff" stroke="#e879f9" stroke-width="2"/>
    <rect x="465" y="50" width="100" height="26" rx="8" fill="#d946ef"/>
    <text x="515" y="67" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">HEAP OBJECT</text>
    <text x="465" y="105" fill="#701a75" font-size="18" font-family="monospace" font-weight="bold">"Alex Roshan"</text>
    <text x="465" y="130" fill="#86198f" font-size="12" font-family="sans-serif">Type: <span font-weight="bold">str</span> | Ref Count: <span font-weight="bold">2</span></text>
    <text x="465" y="150" fill="#a21caf" font-size="11" font-family="monospace">Memory ID: 0x7f9a1b40</text>
  </g>
</svg>

