<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%" fill="none">
  <!-- Start Input Node -->
  <circle cx="70" cy="110" r="32" fill="#ffffff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="70" y="115" fill="#4338ca" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">Input Score</text>

  <path d="M104 110 H170" stroke="#6366f1" stroke-width="2.5"/>

  <!-- Condition Diamond 1 -->
  <polygon points="230,60 290,110 230,160 170,110" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="230" y="108" fill="#92400e" font-size="11" font-family="monospace" font-weight="bold" text-anchor="middle">score >= 90</text>
  <text x="230" y="122" fill="#b45309" font-size="9" font-family="sans-serif" text-anchor="middle">(if branch)</text>

  <!-- True 1 -> Grade A -->
  <path d="M230 60 V30 H360" stroke="#10b981" stroke-width="2.5"/>
  <rect x="360" y="15" width="140" height="40" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="430" y="40" fill="#065f46" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">Grade = "A" ✓</text>

  <!-- False 1 -> Condition Diamond 2 -->
  <path d="M290 110 H350" stroke="#64748b" stroke-width="2"/>
  <text x="315" y="102" fill="#64748b" font-size="10" font-family="sans-serif" text-anchor="middle">False</text>

  <!-- Condition Diamond 2 (elif) -->
  <polygon points="410,60 470,110 410,160 350,110" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="410" y="108" fill="#92400e" font-size="11" font-family="monospace" font-weight="bold" text-anchor="middle">score >= 75</text>
  <text x="410" y="122" fill="#b45309" font-size="9" font-family="sans-serif" text-anchor="middle">(elif branch)</text>

  <!-- True 2 -> Grade B -->
  <path d="M410 60 V30 H540" stroke="#10b981" stroke-width="2.5"/>
  <rect x="540" y="15" width="140" height="40" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="610" y="40" fill="#065f46" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">Grade = "B" ✓</text>

  <!-- False 2 -> Else -->
  <path d="M470 110 H540" stroke="#ef4444" stroke-width="2"/>
  <text x="500" y="102" fill="#ef4444" font-size="10" font-family="sans-serif" text-anchor="middle">False</text>
  <rect x="540" y="90" width="140" height="40" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="610" y="115" fill="#991b1b" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">Grade = "C" (else)</text>
</svg>

