<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%" fill="none">
  <!-- Arguments In -->
  <rect x="50" y="55" width="170" height="90" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="135" y="85" fill="#4f46e5" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">INPUT ARGUMENTS</text>
  <text x="135" y="110" fill="#0f172a" font-size="13" font-family="monospace" font-weight="bold" text-anchor="middle">items, tax_rate=0.08</text>
  <text x="135" y="130" fill="#64748b" font-size="10" font-family="sans-serif" text-anchor="middle">Pass by Object Reference</text>

  <!-- Arrow In -->
  <path d="M220 100 H290" stroke="#6366f1" stroke-width="3"/>

  <!-- Function Box -->
  <rect x="290" y="35" width="220" height="130" rx="20" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5"/>
  <rect x="310" y="55" width="180" height="30" rx="8" fill="#4f46e5"/>
  <text x="400" y="75" fill="#ffffff" font-size="12" font-family="monospace" font-weight="bold" text-anchor="middle">def calculate_total()</text>
  <text x="400" y="110" fill="#312e81" font-size="12" font-family="sans-serif" text-anchor="middle">Local Scope &amp; Stack Frame</text>
  <text x="400" y="130" fill="#4338ca" font-size="11" font-family="monospace" text-anchor="middle">subtotal = sum(...)</text>
  <text x="400" y="150" fill="#6b7280" font-size="10" font-family="sans-serif" text-anchor="middle">Encapsulated Logic</text>

  <!-- Arrow Out -->
  <path d="M510 100 H580" stroke="#10b981" stroke-width="3"/>

  <!-- Return Value -->
  <rect x="580" y="55" width="170" height="90" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="665" y="85" fill="#059669" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">OUTPUT RESULT</text>
  <text x="665" y="110" fill="#064e3b" font-size="13" font-family="monospace" font-weight="bold" text-anchor="middle">return invoice_dict</text>
  <text x="665" y="130" fill="#047857" font-size="10" font-family="sans-serif" text-anchor="middle">Caller Receives Object</text>
</svg>

