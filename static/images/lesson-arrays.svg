<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%" fill="none">
  <!-- Python list: Pointer array -->
  <rect x="40" y="30" width="330" height="160" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="60" y="58" fill="#0f172a" font-size="13" font-family="sans-serif" font-weight="bold">Standard Python List [ ]</text>
  <text x="60" y="78" fill="#64748b" font-size="11" font-family="sans-serif">Array of 64-bit pointers to PyObjects</text>

  <rect x="60" y="95" width="60" height="40" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="90" y="120" fill="#4338ca" font-size="11" font-family="monospace" text-anchor="middle">ptr 1</text>
  <rect x="130" y="95" width="60" height="40" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="160" y="120" fill="#4338ca" font-size="11" font-family="monospace" text-anchor="middle">ptr 2</text>
  <rect x="200" y="95" width="60" height="40" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="230" y="120" fill="#4338ca" font-size="11" font-family="monospace" text-anchor="middle">ptr 3</text>
  <text x="60" y="165" fill="#64748b" font-size="10" font-family="sans-serif">Overhead: ~8 bytes per pointer + PyObject header</text>

  <!-- Python array module: Contiguous primitive buffer -->
  <rect x="420" y="30" width="340" height="160" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
  <text x="440" y="58" fill="#065f46" font-size="13" font-family="sans-serif" font-weight="bold">array.array('i', [...])</text>
  <text x="440" y="78" fill="#047857" font-size="11" font-family="sans-serif">Contiguous C-style Primitive Buffer</text>

  <rect x="440" y="95" width="60" height="40" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="470" y="120" fill="#065f46" font-size="11" font-family="monospace" text-anchor="middle">int (4B)</text>
  <rect x="505" y="95" width="60" height="40" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="535" y="120" fill="#065f46" font-size="11" font-family="monospace" text-anchor="middle">int (4B)</text>
  <rect x="570" y="95" width="60" height="40" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="600" y="120" fill="#065f46" font-size="11" font-family="monospace" text-anchor="middle">int (4B)</text>
  <text x="440" y="165" fill="#047857" font-size="10" font-family="sans-serif">Compact: Direct machine integers with zero PyObject overhead</text>
</svg>

