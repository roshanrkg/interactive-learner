<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%" fill="none">
  <!-- Python App Layer -->
  <rect x="40" y="40" width="180" height="140" rx="18" fill="#ffffff" stroke="#6366f1" stroke-width="2.5"/>
  <rect x="60" y="60" width="140" height="28" rx="8" fill="#4f46e5"/>
  <text x="130" y="79" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Python Application</text>
  <text x="60" y="115" fill="#312e81" font-size="11" font-family="monospace">cursor.execute()</text>
  <text x="60" y="135" fill="#312e81" font-size="11" font-family="monospace">collection.find()</text>
  <text x="60" y="155" fill="#64748b" font-size="10" font-family="sans-serif">PEP 249 Python DB API</text>

  <!-- Connectors Middle Layer -->
  <path d="M220 70 H300" stroke="#6366f1" stroke-width="2.5"/>
  <path d="M220 110 H300" stroke="#10b981" stroke-width="2.5"/>
  <path d="M220 150 H300" stroke="#059669" stroke-width="2.5"/>

  <rect x="300" y="30" width="180" height="160" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="320" y="58" fill="#0f172a" font-size="12" font-family="sans-serif" font-weight="bold">Drivers &amp; Client SDKs</text>
  <rect x="320" y="70" width="140" height="28" rx="6" fill="#e0e7ff"/>
  <text x="390" y="88" fill="#4338ca" font-size="11" font-family="monospace" text-anchor="middle">mysql.connector</text>
  <rect x="320" y="105" width="140" height="28" rx="6" fill="#ecfdf5"/>
  <text x="390" y="123" fill="#047857" font-size="11" font-family="monospace" text-anchor="middle">pymongo / Motor</text>
  <rect x="320" y="140" width="140" height="28" rx="6" fill="#f1f5f9"/>
  <text x="390" y="158" fill="#475569" font-size="11" font-family="monospace" text-anchor="middle">sqlite3 (Built-in)</text>

  <!-- Database Servers -->
  <path d="M480 84 H560" stroke="#6366f1" stroke-width="2.5"/>
  <path d="M480 119 H560" stroke="#10b981" stroke-width="2.5"/>
  <path d="M480 154 H560" stroke="#64748b" stroke-width="2.5"/>

  <rect x="560" y="40" width="200" height="140" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="580" y="70" fill="#0f172a" font-size="12" font-family="sans-serif" font-weight="bold">Database Engines</text>
  <text x="580" y="98" fill="#0284c7" font-size="11" font-family="sans-serif" font-weight="bold">MySQL / MariaDB (Relational)</text>
  <text x="580" y="118" fill="#059669" font-size="11" font-family="sans-serif" font-weight="bold">MongoDB (NoSQL Document)</text>
  <text x="580" y="138" fill="#475569" font-size="11" font-family="sans-serif" font-weight="bold">SQLite (Embedded File)</text>
</svg>

