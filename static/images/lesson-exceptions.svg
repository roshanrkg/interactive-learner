<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%" fill="none">
  <!-- Try Block -->
  <rect x="40" y="40" width="160" height="80" rx="16" fill="#ffffff" stroke="#6366f1" stroke-width="2.5"/>
  <rect x="55" y="55" width="60" height="24" rx="6" fill="#4f46e5"/>
  <text x="85" y="71" fill="#ffffff" font-size="11" font-family="monospace" font-weight="bold" text-anchor="middle">try:</text>
  <text x="55" y="100" fill="#0f172a" font-size="12" font-family="sans-serif">Risky operation</text>

  <!-- Error raised branch -->
  <path d="M200 65 H290" stroke="#ef4444" stroke-width="2.5"/>
  <text x="245" y="55" fill="#ef4444" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">Exception Raised</text>

  <rect x="290" y="30" width="190" height="70" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="310" y="55" fill="#991b1b" font-size="12" font-family="monospace" font-weight="bold">except ValueError as e:</text>
  <text x="310" y="80" fill="#b91c1c" font-size="11" font-family="sans-serif">Handle and recover</text>

  <!-- No Error branch -->
  <path d="M200 95 H290" stroke="#10b981" stroke-width="2.5"/>
  <text x="245" y="115" fill="#10b981" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">No Exception</text>

  <rect x="290" y="115" width="190" height="70" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="310" y="140" fill="#065f46" font-size="12" font-family="monospace" font-weight="bold">else:</text>
  <text x="310" y="165" fill="#047857" font-size="11" font-family="sans-serif">Runs when try succeeds</text>

  <!-- Convergence to Finally -->
  <path d="M480 65 H550 V110" stroke="#64748b" stroke-width="2"/>
  <path d="M480 150 H550 V110" stroke="#64748b" stroke-width="2"/>
  <path d="M550 110 H570" stroke="#64748b" stroke-width="2.5"/>

  <!-- Finally Block -->
  <rect x="570" y="65" width="190" height="90" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/>
  <text x="590" y="95" fill="#0f172a" font-size="13" font-family="monospace" font-weight="bold">finally:</text>
  <text x="590" y="120" fill="#475569" font-size="11" font-family="sans-serif">ALWAYS executes (close file,</text>
  <text x="590" y="138" fill="#475569" font-size="11" font-family="sans-serif">release db connection/locks)</text>
</svg>

