<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%" fill="none">
  <!-- with open() -->
  <rect x="40" y="40" width="220" height="140" rx="18" fill="#ffffff" stroke="#6366f1" stroke-width="2.5"/>
  <rect x="60" y="60" width="180" height="28" rx="8" fill="#4f46e5"/>
  <text x="150" y="79" fill="#ffffff" font-size="11" font-family="monospace" font-weight="bold" text-anchor="middle">with open(path, "r") as f:</text>
  <text x="60" y="115" fill="#312e81" font-size="11" font-family="sans-serif" font-weight="bold">Context Manager Entry:</text>
  <text x="60" y="135" fill="#4338ca" font-size="11" font-family="monospace">f.__enter__() -> OS Handle</text>
  <text x="60" y="155" fill="#64748b" font-size="10" font-family="sans-serif">Acquires file descriptor</text>

  <path d="M260 110 H340" stroke="#6366f1" stroke-width="2.5"/>

  <!-- Read/Write Buffer -->
  <rect x="340" y="40" width="200" height="140" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="360" y="70" fill="#0f172a" font-size="12" font-family="sans-serif" font-weight="bold">I/O Operations</text>
  <text x="360" y="100" fill="#059669" font-size="11" font-family="monospace">content = f.read()</text>
  <text x="360" y="125" fill="#059669" font-size="11" font-family="monospace">f.write("data\n")</text>
  <text x="360" y="155" fill="#64748b" font-size="10" font-family="sans-serif">Buffered streaming I/O</text>

  <path d="M540 110 H620" stroke="#10b981" stroke-width="2.5"/>

  <!-- Auto Close -->
  <rect x="620" y="40" width="150" height="140" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
  <text x="695" y="75" fill="#047857" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">Guaranteed Exit</text>
  <text x="695" y="105" fill="#065f46" font-size="11" font-family="monospace" text-anchor="middle">f.__exit__()</text>
  <text x="695" y="130" fill="#059669" font-size="11" font-family="sans-serif" text-anchor="middle">Auto-closes file</text>
  <text x="695" y="150" fill="#64748b" font-size="10" font-family="sans-serif" text-anchor="middle">Even if crash occurs!</text>
</svg>

