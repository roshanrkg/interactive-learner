<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%" fill="none">
  <!-- Desktop Window Canvas -->
  <rect x="50" y="30" width="340" height="160" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Window Titlebar -->
  <rect x="50" y="30" width="340" height="32" rx="16" fill="#f1f5f9"/>
  <circle cx="70" cy="46" r="4.5" fill="#f87171"/>
  <circle cx="85" cy="46" r="4.5" fill="#fbbf24"/>
  <circle cx="100" cy="46" r="4.5" fill="#34d399"/>
  <text x="220" y="50" fill="#64748b" font-size="10" font-family="sans-serif" text-anchor="middle">Tkinter GUI Application</text>

  <!-- Widgets inside window -->
  <text x="80" y="90" fill="#0f172a" font-size="13" font-family="sans-serif" font-weight="bold">Enter Username:</text>
  <rect x="80" y="102" width="180" height="28" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="92" y="120" fill="#64748b" font-size="11" font-family="monospace">roshan_dev</text>
  <rect x="270" y="102" width="90" height="28" rx="6" fill="#4f46e5"/>
  <text x="315" y="120" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Submit</text>

  <!-- Event Loop Diagram -->
  <path d="M390 110 H470" stroke="#6366f1" stroke-width="2.5"/>
  <text x="430" y="100" fill="#6366f1" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">Events</text>

  <rect x="470" y="35" width="280" height="150" rx="18" fill="#f8fafc" stroke="#6366f1" stroke-width="2"/>
  <text x="495" y="65" fill="#1e1b4b" font-size="13" font-family="sans-serif" font-weight="bold">The GUI Event Loop (mainloop)</text>
  <text x="495" y="92" fill="#4338ca" font-size="11" font-family="monospace">root.mainloop()</text>
  <text x="495" y="115" fill="#64748b" font-size="11" font-family="sans-serif">1. Listens for OS clicks &amp; keystrokes</text>
  <text x="495" y="135" fill="#64748b" font-size="11" font-family="sans-serif">2. Dispatches callback functions</text>
  <text x="495" y="155" fill="#64748b" font-size="11" font-family="sans-serif">3. Redraws UI at 60 FPS</text>
</svg>

