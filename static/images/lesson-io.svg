<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%" fill="none">
  <!-- Input Stream -->
  <rect x="40" y="45" width="180" height="110" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="130" y="80" fill="#4f46e5" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">STANDARD INPUT (stdin)</text>
  <text x="130" y="105" fill="#0f172a" font-size="14" font-family="monospace" font-weight="bold" text-anchor="middle">input("Prompt: ")</text>
  <text x="130" y="125" fill="#64748b" font-size="10" font-family="sans-serif" text-anchor="middle">Returns str type always</text>

  <path d="M220 100 H300" stroke="#6366f1" stroke-width="2.5"/>

  <!-- Python Processing Core -->
  <rect x="300" y="35" width="200" height="130" rx="20" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="400" y="70" fill="#312e81" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="middle">Type Casting &amp; Formatting</text>
  <rect x="320" y="85" width="160" height="30" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="400" y="105" fill="#4338ca" font-size="11" font-family="monospace" text-anchor="middle">int(age) | f"..."</text>
  <text x="400" y="145" fill="#64748b" font-size="10" font-family="sans-serif" text-anchor="middle">Buffer Processing</text>

  <path d="M500 100 H580" stroke="#10b981" stroke-width="2.5"/>

  <!-- Output Stream -->
  <rect x="580" y="45" width="180" height="110" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="670" y="80" fill="#047857" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">STANDARD OUTPUT (stdout)</text>
  <text x="670" y="105" fill="#065f46" font-size="14" font-family="monospace" font-weight="bold" text-anchor="middle">print(..., end="\n")</text>
  <text x="670" y="125" fill="#059669" font-size="10" font-family="sans-serif" text-anchor="middle">Console Display Stream</text>
</svg>

