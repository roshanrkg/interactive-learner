<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%" fill="none">
  <!-- Lexer / Tokenizer Input -->
  <rect x="40" y="65" width="180" height="95" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="130" y="95" fill="#334155" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Python Source Stream</text>
  <rect x="55" y="108" width="150" height="34" rx="8" fill="#e2e8f0"/>
  <text x="130" y="130" fill="#0f172a" font-size="13" font-family="monospace" font-weight="bold" text-anchor="middle">def calculate():</text>

  <!-- Arrow -->
  <path d="M220 112 H270" stroke="#6366f1" stroke-width="2.5"/>

  <!-- Python Lexer Engine -->
  <rect x="270" y="55" width="190" height="115" rx="18" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="365" y="88" fill="#312e81" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="middle">Python Lexer / Parser</text>
  <text x="365" y="108" fill="#4338ca" font-size="10" font-family="sans-serif" text-anchor="middle">keyword.kwlist lookup (35)</text>
  
  <rect x="290" y="122" width="150" height="30" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="365" y="141" fill="#4f46e5" font-size="11" font-family="monospace" font-weight="bold" text-anchor="middle">iskeyword("def") -&gt; True</text>

  <!-- Arrow branching to Keywords vs Identifiers -->
  <path d="M460 90 H520 V65 H540" stroke="#10b981" stroke-width="2"/>
  <path d="M460 135 H520 V160 H540" stroke="#f59e0b" stroke-width="2"/>

  <!-- Reserved Keyword Token Output -->
  <rect x="540" y="35" width="220" height="60" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="650" y="60" fill="#065f46" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Reserved Token: KEYWORD</text>
  <text x="650" y="78" fill="#047857" font-size="10" font-family="monospace" text-anchor="middle">def, if, class, return, with</text>

  <!-- Identifier Token Output -->
  <rect x="540" y="130" width="220" height="60" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="650" y="155" fill="#92400e" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Identifier / Literal: NAME</text>
  <text x="650" y="173" fill="#b45309" font-size="10" font-family="monospace" text-anchor="middle">calculate, score, user_name</text>
</svg>

