<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%" fill="none">
  <!-- Class Blueprint -->
  <rect x="40" y="30" width="220" height="160" rx="18" fill="#ffffff" stroke="#6366f1" stroke-width="2.5"/>
  <rect x="60" y="50" width="180" height="28" rx="8" fill="#4f46e5"/>
  <text x="150" y="69" fill="#ffffff" font-size="12" font-family="monospace" font-weight="bold" text-anchor="middle">class UserAccount:</text>
  
  <text x="60" y="105" fill="#312e81" font-size="11" font-family="sans-serif" font-weight="bold">Attributes (State):</text>
  <text x="60" y="125" fill="#64748b" font-size="11" font-family="monospace">self.username, self._balance</text>
  
  <text x="60" y="150" fill="#312e81" font-size="11" font-family="sans-serif" font-weight="bold">Methods (Behavior):</text>
  <text x="60" y="170" fill="#4338ca" font-size="11" font-family="monospace">def deposit(), def withdraw()</text>

  <!-- Instantiation Arrow -->
  <path d="M260 110 H340" stroke="#6366f1" stroke-width="2.5"/>
  <text x="300" y="100" fill="#6366f1" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">__init__()</text>

  <!-- Instance 1 -->
  <rect x="340" y="30" width="190" height="75" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="360" y="55" fill="#065f46" font-size="12" font-family="sans-serif" font-weight="bold">Instance: user1</text>
  <text x="360" y="75" fill="#047857" font-size="11" font-family="monospace">username = "alex"</text>
  <text x="360" y="93" fill="#059669" font-size="10" font-family="monospace">_balance = $1250.00</text>

  <!-- Instance 2 -->
  <rect x="340" y="115" width="190" height="75" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="360" y="140" fill="#065f46" font-size="12" font-family="sans-serif" font-weight="bold">Instance: user2</text>
  <text x="360" y="160" fill="#047857" font-size="11" font-family="monospace">username = "roshan"</text>
  <text x="360" y="178" fill="#059669" font-size="10" font-family="monospace">_balance = $8400.00</text>

  <!-- Pillars Summary -->
  <rect x="550" y="30" width="210" height="160" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="570" y="60" fill="#0f172a" font-size="13" font-family="sans-serif" font-weight="bold">4 Pillars of OOP</text>
  <text x="570" y="90" fill="#4338ca" font-size="11" font-family="sans-serif">1. Encapsulation (Private fields)</text>
  <text x="570" y="115" fill="#059669" font-size="11" font-family="sans-serif">2. Inheritance (class Child(Parent))</text>
  <text x="570" y="140" fill="#d97706" font-size="11" font-family="sans-serif">3. Polymorphism (Method overriding)</text>
  <text x="570" y="165" fill="#dc2626" font-size="11" font-family="sans-serif">4. Abstraction (abc.ABC)</text>
</svg>

