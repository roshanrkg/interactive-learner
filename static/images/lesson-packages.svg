  <path d="M520 110 H590" stroke="#10b981" stroke-width="2.5"/>

  <!-- PyPI Distribution -->
  <rect x="590" y="40" width="180" height="140" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <rect x="610" y="60" width="80" height="24" rx="6" fill="#059669"/>
