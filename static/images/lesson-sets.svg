<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%" fill="none">
  <!-- Set A -->
  <circle cx="280" cy="110" r="70" fill="#e0e7ff" fill-opacity="0.6" stroke="#6366f1" stroke-width="2.5"/>
  <text x="240" y="115" fill="#312e81" font-size="13" font-family="monospace" font-weight="bold">Set A {1, 2}</text>

  <!-- Set B -->
  <circle cx="360" cy="110" r="70" fill="#fdf4ff" fill-opacity="0.6" stroke="#d946ef" stroke-width="2.5"/>
  <text x="400" y="115" fill="#701a75" font-size="13" font-family="monospace" font-weight="bold">{4, 5}</text>

  <!-- Intersection Center -->
  <text x="320" y="115" fill="#4338ca" font-size="13" font-family="monospace" font-weight="bold" text-anchor="middle">{3}</text>
  <text x="320" y="70" fill="#4338ca" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">A &amp; B (Intersection)</text>

  <!-- Operations Summary Legend -->
  <rect x="520" y="35" width="240" height="150" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="540" y="65" fill="#0f172a" font-size="13" font-family="sans-serif" font-weight="bold">Core Set Operations</text>
  
  <text x="540" y="95" fill="#4338ca" font-size="11" font-family="monospace">A | B  # Union</text>
  <text x="540" y="120" fill="#059669" font-size="11" font-family="monospace">A &amp; B  # Intersection</text>
  <text x="540" y="145" fill="#d97706" font-size="11" font-family="monospace">A - B  # Difference</text>
  <text x="540" y="170" fill="#dc2626" font-size="11" font-family="monospace">A ^ B  # Symmetric Diff</text>
</svg>

