<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%" fill="none">
  <!-- Tuple Box (Immutable) -->
  <rect x="50" y="35" width="320" height="150" rx="20" fill="#f8fafc" stroke="#6366f1" stroke-width="2.5"/>
  <rect x="70" y="55" width="80" height="26" rx="6" fill="#4f46e5"/>
  <text x="110" y="72" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">TUPLE ( )</text>
  <text x="70" y="110" fill="#0f172a" font-size="15" font-family="monospace" font-weight="bold">point = (10, 20)</text>
  <text x="70" y="135" fill="#4338ca" font-size="12" font-family="sans-serif">Immutable • Hashable (Key-ready)</text>
  <text x="70" y="155" fill="#059669" font-size="11" font-family="sans-serif">Lower memory footprint &amp; faster</text>

  <!-- List Box (Mutable) -->
  <rect x="420" y="35" width="330" height="150" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="440" y="55" width="70" height="26" rx="6" fill="#0f172a"/>
  <text x="475" y="72" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">LIST [ ]</text>
  <text x="440" y="110" fill="#0f172a" font-size="15" font-family="monospace" font-weight="bold">coords = [10, 20]</text>
  <text x="440" y="135" fill="#64748b" font-size="12" font-family="sans-serif">Mutable • Dynamic Resizing</text>
  <text x="440" y="155" fill="#d97706" font-size="11" font-family="sans-serif">Supports append(), pop(), sort()</text>
</svg>

