<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Interactive Learner</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    .aurora-bg {
      background: radial-gradient(circle at 15% 20%, rgba(219, 234, 254, 0.85) 0%, transparent 45%),
                  radial-gradient(circle at 85% 25%, rgba(254, 215, 170, 0.75) 0%, transparent 45%),
                  radial-gradient(circle at 50% 85%, rgba(254, 240, 138, 0.35) 0%, transparent 50%),
                  #f8fafc;
      background-attachment: fixed;
    }
  </style>
</head>
<body class="aurora-bg min-h-screen text-slate-800 flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

  <!-- TOP HEADER -->
  <!-- <header class="w-full max-w-6xl mx-auto px-6 py-6 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-black text-xl shadow-md shadow-indigo-200">
        
      </div>
      <div>
        <h1 class="text-base font-extrabold text-slate-900 tracking-tight leading-tight">Interactive Learner</h1>
        <p class="text-xs text-slate-500">Master Python Programming with Visuals & Code</p>
      </div>
    </div>
  </header> -->

  <!-- MAIN LOGIN CARD -->
  <main class="w-full max-w-md mx-auto px-6 py-12">
    <div class="bg-white/85 backdrop-blur-xl rounded-3xl p-8 border border-white/90 shadow-xl shadow-slate-200/50">
      
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-50 text-indigo-600 mb-4 border border-indigo-100/80 shadow-inner">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </div>
        <h2 class="text-2xl font-black text-slate-900 tracking-tight">Welcome Back</h2>
        <p class="text-xs text-slate-500 mt-1.5 leading-relaxed">Please sign in with your Google account to access your course syllabus, code challenges, and quizzes.</p>
      </div>

      <!-- GOOGLE LOGIN BUTTON -->
      <div class="space-y-4">
        <a href="/auth/google" class="w-full flex items-center justify-center gap-3.5 px-5 py-3.5 rounded-2xl border border-slate-200/90 bg-white hover:bg-slate-50 text-slate-700 font-semibold text-sm shadow-sm hover:shadow transition duration-150 active:scale-[0.99]">
          <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Continue with Google</span>
        </a>

        <!-- DEMO/DEV LOGIN (VISIBLE WHEN CONFIGURED OR FOR INSTANT LOCAL TESTING) -->
        <div id="dev-section" class="pt-2">
          <div class="relative flex items-center justify-center my-3">
            <div class="border-t border-slate-200 w-full"></div>
            <span class="bg-white px-3 text-[11px] font-semibold uppercase tracking-wider text-slate-400">Or Test Mode</span>
          </div>

          <a href="/auth/dev-login" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl border border-dashed border-indigo-200 bg-indigo-50/50 hover:bg-indigo-50 text-indigo-700 text-xs font-semibold transition">
            <span>⚡ Sign In as Demo Learner (Instant Test)</span>
          </a>
        </div>
      </div>

      <!-- SECURITY NOTE -->
      <div class="mt-8 pt-5 border-t border-slate-100 flex items-center justify-center gap-2 text-[11px] text-slate-400">
        <svg class="w-3.5 h-3.5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
        <span>Protected with secure session cookies</span>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="w-full text-center py-6 text-xs text-slate-400">
    Interactive Learner &copy; 2026. All rights reserved.
  </footer>

</body>
</html>
